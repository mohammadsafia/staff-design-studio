name: Showcase checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-model-dom-evidence
          path: public/evidence/
